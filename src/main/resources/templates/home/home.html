<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ChocoStore - Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fdf5e6; } 
        .bg-chocolate { background-color: #4b2c20 !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-chocolate mb-4 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="/">
                🍫 ChocoStore
            </a>
            <div>
                <a th:href="@{/nuevo}" class="btn btn-outline-light btn-sm me-2">Inventario (Admin)</a>
                <a th:href="@{/categoria/nueva}" class="btn btn-outline-warning btn-sm">Categorías</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <h2 class="text-center mb-4 text-dark fw-bold" style="color: #4b2c20 !important;">Nuestro Catálogo de Chocolates</h2>
        
        <div class="row row-cols-1 row-cols-md-3 g-4">
            
            <div class="col" th:each="c : ${chocolates}">
                <div class="card h-100 shadow-sm border-0">
                    
                    <div style="height: 200px; background-color: #ffffff; overflow: hidden;" class="w-100 d-flex align-items-center justify-content-center border-bottom">
                        <img th:src="${c.imagen != null && c.imagen != '' ? c.imagen : 'https://via.placeholder.com/300x200?text=Sin+Imagen'}" 
                             alt="Imagen de chocolate" 
                             style="width: 100%; height: 100%; object-fit: contain; padding: 15px;">
                    </div>
                    
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title text-dark fw-bold mb-1" th:text="${c.nombre}">Nombre</h5>
                        <small class="text-muted mb-2">Marca: <span class="fw-semibold text-secondary" th:text="${c.marca}"></span></small>
                        
                        <div class="mb-3">
                            <span class="badge bg-warning text-dark" th:text="${c.categoria != null ? c.categoria.nombre : 'Sin Categoría'}"></span>
                        </div>
                        
                        <div class="mt-auto">
                            <h4 class="text-success fw-bold m-0" th:text="'$' + ${#numbers.formatDecimal(c.precio, 1, 2)}">$0.00</h4>
                        </div>
                    </div>
                    
                </div>
            </div>
            
            <div class="col-12" th:if="${#lists.isEmpty(chocolates)}">
                <div class="alert alert-warning text-center shadow-sm" role="alert">
                    Actualmente no hay chocolates en el catálogo. ¡Ve al Inventario para agregar algunos!
                </div>
            </div>

        </div>
    </div>

</body>
</html>
