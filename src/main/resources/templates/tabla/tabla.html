<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario - ChocoStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🍫 Inventario General de Chocolates</h2>
        <a th:href="@{/chocolates/nuevo}" class="btn btn-primary">⚡ Registrar Nuevo Chocolate</a>
    </div>

    <table class="table table-striped table-hover align-middle shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Catálogo / Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="choc : ${chocolates}">
                <td th:text="${choc.id}">1</td>
                <td>
                    <img th:src="${choc.descripcion != null and choc.descripcion.startsWith('http')} ? ${choc.descripcion} : 'https://images.unsplash.com/photo-1548907040-4d42b321881b?w=100'" 
                         alt="Chocolate" class="img-thumbnail" style="width: 60px; height: 60px; object-fit: cover;">
                </td>
                <td th:text="${choc.nombre}" class="fw-bold">Nombre</td>
                
                <td>
                    <span th:text="${choc.categoria != null} ? ${choc.categoria.nombre} : 'Sin Catálogo'" 
                          class="badge bg-secondary fs-6">Categoría</span>
                </td>
                
                <td th:text="'$' + ${choc.precio}">$0.00</td>
                <td th:text="${choc.stock}">0</td>
                <td>
                    <a th:href="@{/chocolates/editar/{id}(id=${choc.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/chocolates/eliminar/{id}(id=${choc.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
