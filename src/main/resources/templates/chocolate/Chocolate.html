<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Producto - ChocoStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">📝 Registro de Inventario - ChocoStore</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/chocolate/guardar}" th:object="${chocolate}" method="POST">
                
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre del Producto</label>
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Trufa de Maracuyá" required />
                </div>

                <div class="mb-3">
    <label class="form-label fw-bold">Asignar a un Catálogo / Categoría</label>
    <select th:field="*{categoria}" class="form-select" required>
        <option value="" disabled selected>-- Seleccione una Categoría --</option>
        <option th:each="cat : ${listaCategorias}" 
                th:value="${cat.id}" 
                th:text="${cat.nombre}"></option>
    </select>
</div>

<div class="mb-3">
    <label class="form-label fw-bold">URL de la Imagen del Producto</label>
    <input type="url" th:field="*{descripcion}" class="form-control" placeholder="https://ejemplo.com/chocolate.jpg"/>
    <small class="text-muted">Guardaremos el link directo de la imagen para renderizarlo dinámicamente.</small>
</div>

                <div class="mb-3">
                    <label class="form-label fw-bold">URL de la Imagen (o link web)</label>
                    <input type="url" th:field="*{descripcion}" class="form-control" placeholder="https://ejemplo.com/imagen.jpg" />
                    <small class="text-muted">Por el momento, guardaremos el enlace directo de la imagen en este campo.</small>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Precio ($)</label>
                        <input type="number" step="0.01" th:field="*{precio}" class="form-control" placeholder="0.00" required />
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Stock Inicial</label>
                        <input type="number" th:field="*{stock}" class="form-control" placeholder="0" required />
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/chocolate/listar}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">💾 Guardar en Inventario</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
