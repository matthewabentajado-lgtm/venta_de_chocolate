<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Chocolate - Lab 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="card-title mb-0" th:text="${chocolate.id != null} ? 'Modificar Producto' : 'Añadir Nuevo Chocolate'">Gestión de Inventario</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/chocolates/guardar}" th:object="${chocolate}" method="POST">
                        
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del Chocolate</label>
                            <input type="text" th:field="*{nombre}" id="nombre" class="form-control" placeholder="Ej. Barra Bitter 70% Cacao" required />
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="precio" class="form-label">Precio ($)</label>
                                <input type="number" step="0.01" th:field="*{precio}" id="precio" class="form-control" placeholder="0.00" min="0" required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="stock" class="form-label">Unidades en Stock</label>
                                <input type="number" th:field="*{stock}" id="stock" class="form-control" placeholder="0" min="0" required />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="categoria" class="form-label">Categoría Asociada</label>
                            <select th:field="*{categoria}" id="categoria" class="form-select" required>
                                <option value="" disabled selected>-- Seleccione una Categoría --</option>
                                <option th:each="cat : ${listaCategorias}" 
                                        th:value="${cat.id}" 
                                        th:text="${cat.nombre}">
                                </option>
                            </select>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/chocolates}" class="btn btn-secondary me-md-2">Volver al Menú</a>
                            <button type="submit" class="btn btn-primary">Registrar Producto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
