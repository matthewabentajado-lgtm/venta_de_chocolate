<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Categoría - Lab 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h4 class="card-title mb-0" th:text="${categoria.id != null} ? 'Editar Categoría' : 'Nueva Categoría'">Gestión de Categoría</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="POST">
                        
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre de la Categoría</label>
                            <input type="text" th:field="*{nombre}" id="nombre" class="form-control" placeholder="Ej. Chocolates Oscuros" required />
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea th:field="*{descripcion}" id="descripcion" class="form-control" rows="3" placeholder="Detalles de la categoría..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="imagenUrl" class="form-label">URL de la Imagen</label>
                            <input type="url" th:field="*{imagenUrl}" id="imagenUrl" class="form-control" placeholder="https://ejemplo.com/imagen.jpg" />
                        </div>

                        <div class="mb-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select th:field="*{estado}" id="estado" class="form-select">
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/categorias}" class="btn btn-secondary me-md-2">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Categoría</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
