<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ChocoStore - Gestión de Categorías</title>
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold" th:href="@{/}">🍫 ChocoStore</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/tabla}">Inventario Chocolates</a>
                <a class="nav-link active" th:href="@{/categoria/nueva}">Categorías</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header text-white" th:classappend="${categoria.id != null} ? 'bg-warning text-dark' : 'bg-primary'">
                        <h5 class="card-title mb-0" th:text="${categoria.id != null} ? 'Modificar Categoría' : 'Nueva Categoría'"></h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/categoria/guardar}" th:object="${categoria}" method="POST">
                            
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label">Nombre de la Categoría</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej: Chocolates Amargos" autofocus>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">Guardar</button>
                                <a th:href="@{/categoria/nueva}" class="btn btn-secondary" th:if="${categoria.id != null}">Cancelar Edición</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="card-title mb-0">Listado de Categorías</h5>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-striped table-hover mb-0 align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 15%">N°</th>
                                    <th>Nombre de Categoría</th>
                                    <th class="text-center" style="width: 30%">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat, iterStat : ${categorias}">
                                    <td th:text="${iterStat.count}">1</td>
                                    <td th:text="${cat.nombre}" class="fw-bold">Nombre</td>
                                    <td class="text-center">
                                        <a th:href="@{/categoria/editar/{id}(id=${cat.id})}" class="btn btn-warning btn-sm me-1">Editar</a>
                                        
                                        <a th:href="@{/categoria/eliminar/{id}(id=${cat.id})}" class="btn btn-danger btn-sm" 
                                           onclick="return confirm('¿Estás seguro de eliminar esta categoría? Se borrarán los chocolates asociados.');">
                                            Eliminar
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(categorias)}">
                                    <td colspan="3" class="text-center text-muted py-3">No hay categorías registradas aún.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

</body>
</html>
