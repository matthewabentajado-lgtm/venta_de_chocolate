<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChocoStore - Detalle Multimedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🍫 ChocoStore</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Inicio (Menú)</a>
                <a class="nav-link" href="/inventario">Vista Tabla</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 mb-5">
                <div class="card shadow-lg border-0 overflow-hidden rounded-3">
                    
                    <img th:src="${#strings.isEmpty(categoria.imagenUrl)} ? 'https://images.unsplash.com/photo-1548907040-4d42b52125ca?w=1000' : ${categoria.imagenUrl}" 
                         class="img-fluid w-100 object-fit-cover" 
                         style="height: 380px;" 
                         alt="Imagen representativa de la categoría">
                    
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                            <h2 class="card-title fw-bold text-dark mb-0" th:text="${categoria.nombre}">Línea de Selección</h2>
                            
                            <span class="badge px-3 py-2 fs-6" 
                                  th:classappend="${categoria.estado == 'Activo'} ? 'bg-success' : 'bg-danger'" 
                                  th:text="${categoria.estado}">Estado</span>
                        </div>
                        
                        <div class="mt-3">
                            <h5 class="fw-bold text-secondary">Descripción Técnica / Comercial:</h5>
                            <p class="card-text text-muted fs-5 lh-base" th:text="${categoria.descripcion}">
                                No hay descripciones ni detalles adicionales cargados en los metadatos de esta categoría.
                            </p>
                        </div>
                    </div>
                    
                    <div class="card-footer bg-white border-0 p-4 d-flex justify-content-between align-items-center">
                        <a th:href="@{/categorias/editar/{id}(id=${categoria.id})}" class="btn btn-outline-warning px-4">Modificar Categoría</a>
                        <a href="/" class="btn btn-dark px-4">Volver al Menú Principal</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
